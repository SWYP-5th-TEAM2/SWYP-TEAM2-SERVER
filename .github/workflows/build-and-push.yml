name: Build and Push Image
concurrency:
  group: deploy-release
  cancel-in-progress: false

on:
  push:
    branches:
      - release

permissions:
  contents: read
  id-token: write

env:
  AZURE_CORE_OUTPUT: none
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
  IMAGE_NAME: ${{ vars.ACR_IMAGE_NAME }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:release
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 100

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy application to Azure VM
        shell: bash
        run: |
          set -Eeuo pipefail
          
          DEPLOY_OUTPUT="$(
            az vm run-command invoke \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ vars.AZURE_VM_NAME }}" \
              --command-id RunShellScript \
              --scripts @infra/scripts/deploy.sh \
              --parameters \
                "${{ vars.ACR_NAME }}" \
                "/opt/mohaeng-server" \
                "${{ vars.ACR_LOGIN_SERVER }}/${{ vars.ACR_IMAGE_NAME }}:${{ github.sha }}" \
                "${{ secrets.KAKAO_LOCAL_REST_API_KEY }}" \
              --query 'value[0].message' \
              --output tsv
          )"
          
          printf '%s\n' "$DEPLOY_OUTPUT"
          
          if ! grep -q 'DEPLOYMENT_SUCCEEDED' <<< "$DEPLOY_OUTPUT"; then
            echo "VM deployment failed"
            exit 1
          fi

      - name: Verify public health endpoint
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "${{ vars.APP_HEALTH_URL }}"

